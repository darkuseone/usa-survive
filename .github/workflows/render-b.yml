# Параллельный рендер версии B (r3, Remotion + three.js) на раннерах GitHub Actions.
# Запуск: изменить и запушить r3/render-request.json (композиция, кадры, число задач, настройки качества).
# Каждая задача рендерит свой кусок кадров (видео без звука); готовые куски пушатся в ветку render-out,
# звук версии A подкладывается локально (tools: r3/scripts/collect_b.sh). Mixkit-звуки в git не попадают.
name: render-b
on:
  push:
    paths: ['r3/render-request.json']
permissions:
  contents: write
concurrency: { group: render-b, cancel-in-progress: true }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { matrix: "${{ steps.m.outputs.matrix }}" }
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          r = json.load(open('r3/render-request.json')); tot, n = r['frames'], r['jobs']; step = -(-tot // n)
          inc = [{'a': a, 'b': b} for a, b in r['ranges']] if r.get('ranges') else [{'a': a, 'b': min(tot - 1, a + step - 1)} for a in range(0, tot, step)]
          print('matrix=' + json.dumps({'include': inc}))
          PY
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy: { fail-fast: false, matrix: "${{ fromJson(needs.plan.outputs.matrix) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: r3/package-lock.json }
      - name: deps
        working-directory: r3
        run: npm ci && npx remotion browser ensure
      - name: render
        working-directory: r3
        run: |
          PROPS=$(python3 -c "import json; print(json.dumps(json.load(open('render-request.json'))['props']))")
          CC=$(python3 -c "import json; print(json.load(open('render-request.json')).get('concurrency', 2))")
          COMP=$(python3 -c "import json; print(json.load(open('render-request.json')).get('composition', 'GasShort'))")
          mkdir -p out/ci && A=$(printf %04d ${{ matrix.a }}) && set -o pipefail
          # до 3 попыток: редкие падения SwiftShader/WebGL на раннере; без файла задача падает (раньше кусок терялся молча)
          for try in 1 2 3; do
            npx remotion render src/index.ts $COMP out/ci/chunk_$A.mp4 --gl=swangle --concurrency=$CC --frames=${{ matrix.a }}-${{ matrix.b }} \
              --codec=h264 --crf=16 --timeout=900000 --props="$PROPS" 2>&1 | grep -v "fallback to software" | tail -60 && break || echo "попытка $try не удалась"
          done
          test -s out/ci/chunk_$A.mp4
      - uses: actions/upload-artifact@v4
        with: { name: "chunk-${{ matrix.a }}", path: r3/out/ci/chunk_*.mp4, retention-days: 3, if-no-files-found: error }
  collect:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: chunk-*, merge-multiple: true, path: chunks }
      - name: push chunks to render-out
        run: |
          cd chunks && ls -la && git init -q && git checkout -q -b render-out
          git config user.name "render-bot" && git config user.email "render-bot@users.noreply.github.com"
          git add chunk_*.mp4 && git commit -qm "render-b: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" render-out
